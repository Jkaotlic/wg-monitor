<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>wg-monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Тема ставится до первой отрисовки, иначе тёмный клиент на долю
      // секунды показывает светлую страницу. Значения цветов живут в
      // style.css и src/theme.js -- здесь только выбор темы.
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp
        var scheme = (tg && tg.colorScheme) ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', scheme === 'dark' ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

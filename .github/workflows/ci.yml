name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-test:
    name: vet + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 180s

  test-race:
    name: race detector
    # TEST-01 от rc20 audit: codebase имеет ≥5 concurrency surfaces
    # (Dispatcher.ensureTopic double-checked-lock, Watcher.scan map,
    # async relay в handler, retention 3 параллельных loop'а, command
    # queue), но `-race` НИКОГДА не запускался — Makefile и CI оба
    # пропускали. CGO=1 (race требует gcc) на ubuntu-latest есть из коробки.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -race -count=1 -timeout 360s
        env:
          CGO_ENABLED: 1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
      # Start with a blocking high-severity gate while the historical gosec
      # baseline is triaged. Excluded taint classes are noisy for controlled
      # command runners, release-proxy allowlists, and deliberate command
      # dispatch surfaces; G101 stays enabled and false positives are annotated.
      - run: gosec -severity high -exclude=G702,G703,G704 -exclude-dir=.gomodcache -exclude-dir=.gopath -exclude-dir=.gocache ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0 # 2026.1
      - run: staticcheck ./...

  grype:
    name: grype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/anchore/grype/cmd/grype@v0.115.0
      - run: grype dir:. --fail-on high

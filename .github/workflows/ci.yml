name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-test:
    name: vet + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 180s

  miniapp:
    name: mini app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
        working-directory: miniapp
      # Тесты покрывают чистую логику фронта: контраст палитры, дисциплину
      # токенов, навигацию, разбор ответов роутера. Вёрстка тестами не
      # покрывается -- она проверяется скриншотами вручную (miniapp/dev).
      - run: npm test
        working-directory: miniapp
      # Бандл коммитится в internal/backend/miniapp_static; пересборка здесь
      # ловит случай, когда исходники поменяли, а собрать забыли.
      - run: npm run build
        working-directory: miniapp
      - name: бандл пересобран и закоммичен
        run: git diff --exit-code -- internal/backend/miniapp_static

  test-race:
    name: race detector
    # TEST-01 от rc20 audit: codebase имеет ≥5 concurrency surfaces
    # (Dispatcher.ensureTopic double-checked-lock, Watcher.scan map,
    # async relay в handler, retention 3 параллельных loop'а, command
    # queue), но `-race` НИКОГДА не запускался — Makefile и CI оба
    # пропускали. CGO=1 (race требует gcc) на ubuntu-latest есть из коробки.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -race -count=1 -timeout 360s
        env:
          CGO_ENABLED: 1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # gosec v2.29.0 со своим x/tools не читает формат экспорта Go 1.27.2:
      # «package … has type errors» на каждом пакете. Собираем тот же gosec со
      # свежим x/tools (как staticcheck ниже); вернуть `go install …@vX`,
      # когда выйдет релиз gosec с поддержкой 1.27.2.
      - name: gosec v2.29.0 с x/tools v0.51.0
        run: |
          mkdir -p "$RUNNER_TEMP/gosec" && cd "$RUNNER_TEMP/gosec"
          go mod init gsbuild
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.51.0
          go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec
      # Start with a blocking high-severity gate while the historical gosec
      # baseline is triaged. Excluded taint classes are noisy for controlled
      # command runners, release-proxy allowlists, and deliberate command
      # dispatch surfaces; G101 stays enabled and false positives are annotated.
      - run: gosec -severity high -exclude=G702,G703,G704 -exclude-dir=.gomodcache -exclude-dir=.gopath -exclude-dir=.gocache ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # staticcheck v0.8.1 (2026.2) тянет x/tools, который не читает формат
      # экспорта Go 1.27.2 («export data version 5»), а 1.27.2 обязателен из-за
      # уязвимостей net/http (GO-2026-6609..6617). Собираем тот же staticcheck
      # со свежим x/tools; вернуть простой `go install …@vX`, когда выйдет
      # релиз staticcheck с поддержкой 1.27.2.
      - name: staticcheck v0.8.1 с x/tools v0.51.0
        run: |
          mkdir -p "$RUNNER_TEMP/staticcheck" && cd "$RUNNER_TEMP/staticcheck"
          go mod init scbuild
          go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0
          go build -o "$(go env GOPATH)/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck
      - run: staticcheck ./...

  grype:
    name: grype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/anchore/grype/cmd/grype@v0.118.0
      - run: grype dir:. --fail-on high

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet-test:
    name: vet + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 180s

  miniapp:
    name: mini app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: miniapp
      # Тесты покрывают чистую логику фронта: контраст палитры, дисциплину
      # токенов, навигацию, разбор ответов роутера. Вёрстка тестами не
      # покрывается -- она проверяется скриншотами вручную (miniapp/dev).
      - run: npm test
        working-directory: miniapp
      # Бандл коммитится в internal/backend/miniapp_static; пересборка здесь
      # ловит случай, когда исходники поменяли, а собрать забыли.
      - run: npm run build
        working-directory: miniapp
      - name: бандл пересобран и закоммичен
        run: git diff --exit-code -- internal/backend/miniapp_static

  test-race:
    name: race detector
    # TEST-01 от rc20 audit: codebase имеет ≥5 concurrency surfaces
    # (Dispatcher.ensureTopic double-checked-lock, Watcher.scan map,
    # async relay в handler, retention 3 параллельных loop'а, command
    # queue), но `-race` НИКОГДА не запускался — Makefile и CI оба
    # пропускали. CGO=1 (race требует gcc) на ubuntu-latest есть из коробки.
    # CI-01 (аудит 26.10): internal/backend под -race шёл ~330 с при потолке
    # 360 с -- новые тесты уронили бы CI по таймауту, а не по дефекту.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -race -count=1 -timeout 600s
        env:
          CGO_ENABLED: 1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      # Start with a blocking high-severity gate while the historical gosec
      # baseline is triaged. Excluded taint classes are noisy for controlled
      # command runners, release-proxy allowlists, and deliberate command
      # dispatch surfaces; G101 stays enabled and false positives are annotated.
      - run: gosec -severity high -exclude=G702,G703,G704 -exclude-dir=.gomodcache -exclude-dir=.gopath -exclude-dir=.gocache ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...

  grype:
    name: grype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/anchore/grype/cmd/grype@v0.121.3
      - run: grype dir:. --fail-on high

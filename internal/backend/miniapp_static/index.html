      Тема одна -- тёмная, и data-theme стоит прямо в разметке: выбирать
      нечего, а скрипт определения схемы только добавлял бы работу до первой
      отрисовки. Цвета живут в style.css и src/theme.js.

      IBM Plex грузится ссылкой, а не бандлится: это единственный внешний
      хост, который допускает CSP Telegram, и до его загрузки вёрстку держит
      системный стек из --font-body. Шрифт -- часть дизайн-системы, а не
      украшение: моноширинным набирается всё, что оператор сверяет глазами
      с роутером.
    -->
